<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#161b2e" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pillSlide {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(10px); }
      }

      .floating-card-1 {
        animation: floatSlow1 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-orb {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .dashed-connection {
        stroke-dasharray: 6 6;
        animation: dashMove 3s linear infinite;
      }
      .pill-move {
        animation: pillSlide 6s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="1020" cy="110" r="130" fill="#6366f1" filter="url(#glow)" class="pulse-orb" opacity="0.4" />
  <circle cx="900" cy="260" r="100" fill="#06b6d4" filter="url(#glow)" class="pulse-orb" opacity="0.25" />
  <circle cx="180" cy="80" r="90" fill="#8b5cf6" filter="url(#glow)" class="pulse-orb" opacity="0.2" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Positioned safely on right side) -->
  <g id="dynamic-illustrations">
    <!-- Connecting Dashed Flow Paths -->
    <path d="M 820 180 C 890 120, 930 140, 980 90" fill="none" stroke="#38bdf8" stroke-width="2" class="dashed-connection" opacity="0.6" />
    <path d="M 980 180 C 1020 220, 1050 210, 1090 240" fill="none" stroke="#c084fc" stroke-width="2" class="dashed-connection" opacity="0.6" />

    <!-- Animated Component Card 1 (Visual Page Builder Canvas) -->
    <g class="floating-card-1">
      <rect x="880" y="45" width="240" height="145" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Card Header -->
      <rect x="880" y="45" width="240" height="28" rx="12" fill="#1e293b" opacity="0.9" />
      <circle cx="900" cy="59" r="4.5" fill="#ef4444" opacity="0.8" />
      <circle cx="915" cy="59" r="4.5" fill="#f59e0b" opacity="0.8" />
      <circle cx="930" cy="59" r="4.5" fill="#10b981" opacity="0.8" />
      <text x="955" y="63" fill="#94a3b8" class="badge-text" font-size="11">Page Canvas: Dynamic Zone</text>
      <!-- Layout Wireframe Blocks -->
      <rect x="898" y="85" width="204" height="26" rx="6" fill="#38bdf8" opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="912" y="102" fill="#38bdf8" class="badge-text" font-size="10">&lt;HeroSection variant="fluid" /&gt;</text>
      <rect x="898" y="120" width="98" height="52" rx="6" fill="#818cf8" opacity="0.15" stroke="#818cf8" stroke-width="1" />
      <rect x="1004" y="120" width="98" height="52" rx="6" fill="#c084fc" opacity="0.15" stroke="#c084fc" stroke-width="1" />
    </g>

    <!-- Animated Component Card 2 (Component Picker Stack) -->
    <g class="floating-card-2">
      <rect x="800" y="165" width="220" height="140" rx="12" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" />
      <!-- Card Header -->
      <rect x="800" y="165" width="220" height="28" rx="12" fill="#1e1b4b" opacity="0.7" />
      <text x="818" y="183" fill="#c7d2fe" class="badge-text" font-size="11">📦 Component Registry</text>
      <!-- Nested Pills & Blocks -->
      <g class="pill-move">
        <rect x="815" y="204" width="85" height="22" rx="11" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1" />
        <text x="827" y="219" fill="#e0f2fe" class="badge-text" font-size="10">⚡ Slice Block</text>
      </g>
      <rect x="910" y="204" width="92" height="22" rx="11" fill="#7c3aed" opacity="0.3" stroke="#a78bfa" stroke-width="1" />
      <text x="922" y="219" fill="#ede9fe" class="badge-text" font-size="10">🎨 Visual UI</text>
      <rect x="815" y="236" width="187" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="825" y="251" fill="#94a3b8" class="badge-text" font-size="10">JSON Content Model: Validated</text>
      <rect x="815" y="268" width="125" height="22" rx="6" fill="#10b981" opacity="0.2" stroke="#34d399" stroke-width="1" />
      <text x="827" y="283" fill="#6ee7b7" class="badge-text" font-size="10">✔ Live Preview Sync</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Protected left half, fully legible, never obscured) -->
  <g id="foreground-content" transform="translate(70, 0)">
    <!-- Category Tag / Eyebrow Pill -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e293b" stroke="#4f46e5" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#e2e8f0" class="badge-text">CURATED ECOSYSTEM &amp; BENCHMARKS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" class="title-text">
      Dynamic Page Layout
    </text>
    <text x="0" y="180" fill="url(#accentGrad)" class="title-text">
      Management
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="222" fill="#cbd5e1" class="subtitle-text">
      Visual Page Builders • Component Composition • Headless CMS
    </text>
    <text x="0" y="248" fill="#94a3b8" class="subtitle-text" font-size="15">
      The authoritative index of open-source engines and enterprise SaaS solutions.
    </text>

    <!-- Highlight Meta Badges in Banner -->
    <g transform="translate(0, 276)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#38bdf8" class="badge-text">⚡ 19+ Open Source</text>

      <rect x="147" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="160" y="18" fill="#a78bfa" class="badge-text">💼 10+ SaaS Tools</text>

      <rect x="284" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="296" y="18" fill="#34d399" class="badge-text">📊 Market Dynamics</text>
    </g>
  </g>
</svg>
